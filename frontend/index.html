<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跑步里程追踪器</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 15px;
      -webkit-tap-highlight-color: transparent;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    
    /* 头部 */
    header {
      text-align: center;
      color: white;
      margin-bottom: 25px;
      padding: 20px 0;
    }
    header h1 { 
      font-size: 2em; 
      margin-bottom: 10px;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    header p { 
      opacity: 0.95; 
      font-size: 1.05em;
      font-weight: 300;
    }
    
    /* 导航 */
    .nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .nav a {
      background: rgba(255,255,255,0.25);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      font-size: 0.95em;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.3);
      display: inline-flex;
      align-items: center;
    }
    .nav a i { transition: transform 0.3s; }
    .nav a:hover i { transform: scale(1.1); }
    .nav a:active { background: rgba(255,255,255,0.4); transform: scale(0.98); }
    .nav a.active { 
      background: white; 
      color: #667eea;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transform: translateY(-2px);
    }
    .nav a.active i {
      color: #667eea;
    }
    
    /* 仪表盘 */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    
    .card {
      background: rgba(255,255,255,0.98);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    }
    .card-icon { 
      font-size: 2.5em; 
      margin-bottom: 12px;
      color: #667eea;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .card-value { 
      font-size: 2em; 
      font-weight: 800; 
      color: #667eea;
    }
    .card-label { 
      color: #666; 
      margin-top: 8px; 
      font-size: 0.9em;
      font-weight: 500;
    }
    .card-sub { 
      font-size: 0.8em; 
      color: #999; 
      margin-top: 8px;
      font-weight: 300;
    }
    
    /* 快捷操作 */
    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }
    
    .btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 35px;
      font-size: 1.05em;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s;
      box-shadow: 0 6px 25px rgba(102,126,234,0.4);
      font-weight: 600;
    }
    .btn:active { transform: scale(0.95); }
    .btn:hover { 
      box-shadow: 0 8px 30px rgba(102,126,234,0.5);
      transform: translateY(-2px);
    }
    .btn-secondary { 
      background: rgba(255,255,255,0.25); 
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.5);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.35);
    }
    
    /* 最近跑步 */
    .recent-runs {
      background: rgba(255,255,255,0.98);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
    .recent-runs h2 { 
      color: #333; 
      margin-bottom: 18px; 
      font-size: 1.3em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .recent-runs h2 i {
      color: #667eea;
      animation: rotate 4s linear infinite;
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .run-list { list-style: none; }
    .run-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      transition: all 0.3s;
    }
    .run-item:last-child { border-bottom: none; }
    .run-item:hover {
      background: rgba(102,126,234,0.05);
      border-radius: 10px;
      margin: 0 -10px;
      padding: 15px 20px;
    }
    .run-info { flex: 1; }
    .run-runner { 
      font-weight: 600; 
      color: #333;
      font-size: 1em;
      margin-bottom: 4px;
    }
    .run-date { 
      color: #999; 
      font-size: 0.85em;
      font-weight: 300;
    }
    .run-stats {
      display: flex;
      gap: 20px;
      text-align: right;
    }
    .run-stat {
      min-width: 60px;
    }
    .run-stat-value {
      font-weight: 700;
      color: #667eea;
      font-size: 1.1em;
    }
    .run-stat-label {
      color: #999;
      font-size: 0.75em;
      margin-top: 2px;
    }
    
    /* 移动端适配 */
    @media (max-width: 480px) {
      body { padding: 10px; }
      header h1 { font-size: 1.6em; }
      .dashboard { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .card { padding: 15px; }
      .card-value { font-size: 1.6em; }
      .nav a { padding: 10px 18px; font-size: 0.9em; }
      .btn { padding: 12px 24px; font-size: 0.95em; }
      .run-item { flex-direction: column; align-items: flex-start; gap: 10px; }
      .run-stats { width: 100%; justify-content: space-around; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-person-running" style="color:#fff;"></i> 轻跑如风</h1>
      <p>记录每一步，成就更好的自己</p>
    </header>
    
    <nav class="nav">
      <a href="/" class="active"><i class="fas fa-house" style="margin-right:6px;"></i>首页</a>
      <a href="/upload"><i class="fas fa-cloud-arrow-up" style="margin-right:6px;"></i>上传</a>
      <a href="/stats"><i class="fas fa-chart-simple" style="margin-right:6px;"></i>统计</a>
      <a href="/runners"><i class="fas fa-users-line" style="margin-right:6px;"></i>人员</a>
      <a href="/" style="background:rgba(255,255,255,0.3);"><i class="fas fa-rotate-right" style="margin-right:6px;"></i>刷新</a>
    </nav>
    
    <style>
      .nav a i { color: rgba(255,255,255,0.9); }
      .nav a:hover i { color: #fff; }
    </style>
    
    <div class="dashboard" id="dashboard">
      <div class="card">
        <div class="card-icon"><i class="fas fa-road"></i></div>
        <div class="card-value" id="totalDistance">-</div>
        <div class="card-label">总跑量</div>
        <div class="card-sub">公里</div>
      </div>
      <div class="card">
        <div class="card-icon"><i class="fas fa-shoe-prints"></i></div>
        <div class="card-value" id="totalRuns">-</div>
        <div class="card-label">跑步次数</div>
        <div class="card-sub">次</div>
      </div>
      <div class="card">
        <div class="card-icon"><i class="fas fa-fire"></i></div>
        <div class="card-value" id="totalCalories">-</div>
        <div class="card-label">消耗热量</div>
        <div class="card-sub">大卡</div>
      </div>
      <div class="card">
        <div class="card-icon"><i class="fas fa-calendar-days"></i></div>
        <div class="card-value" id="thisMonthDistance">-</div>
        <div class="card-label">本月跑量</div>
        <div class="card-sub">公里</div>
      </div>
    </div>
    
    <div class="quick-actions">
      <a href="/upload" class="btn"><i class="fas fa-cloud-arrow-up"></i> 上传截图</a>
      <a href="/stats" class="btn btn-secondary"><i class="fas fa-chart-column"></i> 查看统计</a>
    </div>
    
    <div class="recent-runs">
      <h2>最近跑步记录</h2>
      <ul class="run-list" id="runList">
        <li style="text-align:center;padding:30px;color:#999;">加载中...</li>
      </ul>
    </div>
  </div>
  
  <script>
    // 全局刷新函数
    window.loadPageData = function() {
      loadDashboard();
      loadRecentRuns();
    };
    

    
    async function loadDashboard() {
      try {
        const res = await fetch('/api/dashboard?t=' + Date.now());
        const data = await res.json();
        
        document.getElementById('totalDistance').textContent = (data.totalDistance || 0).toFixed(1);
        document.getElementById('totalRuns').textContent = data.totalRuns || 0;
        document.getElementById('totalCalories').textContent = data.totalCalories || 0;
        document.getElementById('thisMonthDistance').textContent = (data.thisMonthDistance || 0).toFixed(1);
        
        console.log('📊 仪表盘已加载');
      } catch (error) {
        console.error('❌ 加载仪表盘失败:', error);
      }
    }
    
    async function loadRecentRuns() {
      try {
        const res = await fetch('/api/runs?validOnly=true&t=' + Date.now());
        const data = await res.json();
        
        const runList = document.getElementById('runList');
        const runs = data.runs.slice(0, 10);
        
        if (runs.length === 0) {
          runList.innerHTML = '<li style="text-align:center;padding:30px;color:#999;">暂无跑步记录，快上传第一张截图吧！</li>';
          return;
        }
        
        runList.innerHTML = runs.map((run, index) => `
          <li class="run-item">
            <div class="run-info">
              <div class="run-runner"><i class="fas fa-person-running" style="color:#667eea;margin-right:6px;"></i>${run.runner}</div>
              <div class="run-date"><i class="fas fa-calendar" style="color:#999;margin-right:4px;"></i>${run.date}</div>
            </div>
            <div class="run-stats">
              <div class="run-stat">
                <div class="run-stat-value"><i class="fas fa-road" style="color:#667eea;margin-right:4px;"></i>${run.distance.toFixed(2)}</div>
                <div class="run-stat-label">公里</div>
              </div>
              <div class="run-stat">
                <div class="run-stat-value"><i class="fas fa-bolt" style="color:#f39c12;margin-right:4px;"></i>${run.pace}</div>
                <div class="run-stat-label">配速</div>
              </div>
              <div class="run-stat">
                <div class="run-stat-value"><i class="fas fa-fire" style="color:#e74c3c;margin-right:4px;"></i>${run.calories}</div>
                <div class="run-stat-label">大卡</div>
              </div>
            </div>
          </li>
        `).join('');
        
        console.log('🏃 最近跑步记录已加载');
      } catch (error) {
        console.error('❌ 加载跑步记录失败:', error);
      }
    }
    
    // 页面加载时初始化
    loadDashboard();
    loadRecentRuns();
  </script>
</body>
</html>
